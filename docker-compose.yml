services:
  ros:
    build: .
    image: camcal:jazzy
    container_name: camcal
    network_mode: host
    ipc: host
    privileged: true            # lets the container see /dev/video* if you attach a cam via usbipd
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1      # so calibrator progress shows in `docker compose logs`
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
      - /dev:/dev
      - ./images:/work/images
      - ./calib:/work/calib
      - ./scripts:/work/scripts
      - ./ros2_ws:/work/ros2_ws
    working_dir: /work
    stdin_open: true
    tty: true
    command: bash
